[workspace]
resolver = "2"
members = ["crates/heron-core", "crates/heron-proton", "crates/heron-google", "crates/heron-discord", "crates/herond", "crates/heron"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/tomsjansons/heron"

[workspace.dependencies]
heron-core = { path = "crates/heron-core" }
heron-proton = { path = "crates/heron-proton" }
heron-google = { path = "crates/heron-google" }
heron-discord = { path = "crates/heron-discord" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "fs", "time", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
